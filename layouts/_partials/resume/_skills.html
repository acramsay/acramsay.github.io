<section id="skills" class="section">
    <h2 class="section__title">Skills</h2>
    <div class="section__content">
        <ul class="skills">
            {{ range .skills }}
            <li class="skills__group">
                <span class="skills__name">{{ .name | safeHTML }}</span>
                <ul class="skills__keywords">
                    {{ range .keywords }}
                    <li>{{ . | safeHTML }}</li>
                    {{ end }}
                </ul>
            </li>
            {{ end }}
        </ul>
    </div>
</section>
