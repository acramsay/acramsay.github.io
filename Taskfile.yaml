version: "3"

vars:
  TOOLSDIR: .tools
  HUGO: "{{ joinPath .TOOLSDIR `hugo` }}"
  # This is a bad workaround. Hugo relies on build tags to build the extended version.
  # It really shouldn't. Note that these tags apply to ALL tools. Yuck
  # Possible solution? https://github.com/gohugoio/hugo/issues/10801
  GOBUILDTAGS: extended

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  cibuild:
    desc: Build the site for production
    deps:
      - install
      - update
    cmds:
      - '{{ .HUGO }} --gc --environment production --minify --baseURL "{{ .BASEURL | default "http://localhost/"}}"'

  clean:
    desc: Remove tools, build output, and caches
    cmds:
      - task: stop
      - go clean --modcache
      - "{{ .HUGO }} mod clean"
      - rm -rf .tools public resources || true

  install:
    desc: Build and install Hugo and other tools
    vars:
      TOOLS:
        sh: cat tools.go | grep _ | awk -F'"' '{print $2}'
    cmds:
      - mkdir -p {{ .TOOLSDIR }}
      - for: {var: TOOLS, as: TOOL}
        cmd: go build -C {{ .TOOLSDIR }} -o {{ base .TOOL }} -trimpath -tags {{ .GOBUILDTAGS | default "\"\"" }} {{ .TOOL }}

  restart:
    desc: Stop and start the Hugo dev server
    cmds:
      - task: stop
      - task: start

  restart-clean:
    desc: Stop, clean, reinstall, and start the Hugo dev server
    cmds:
      - task: stop
      - task: clean
      - task: install
      - task: start

  resume:pdf:
    desc: Render the resume to an optimized PDF in ~/Downloads
    vars:
      URL: http://localhost:1313/resume/
      PDF: '{{ joinPath .HOME "Downloads" "Resume - Alex Ramsay.pdf" }}'
    preconditions:
      - sh: curl --silent --fail --output /dev/null '{{ .URL }}'
        msg: 'local server is not running'
    cmds:
      - chromium --headless --no-pdf-header-footer --generate-pdf-document-outline --print-to-pdf='{{ .PDF }}' '{{ .URL }}'

  resume:pdf:onetime:
    desc: Render a job-specific resume PDF into pdfs/<slug>/, where slug is name-jobtitle
    vars:
      URL: http://localhost:1313/resume/
      SLUG:
        sh: printf '%s' '{{ .NAME }}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
      OUTDIR: '{{ joinPath "pdfs" .SLUG }}'
    requires:
      vars: [NAME]
    preconditions:
      - sh: curl --silent --fail --output /dev/null '{{ .URL }}'
        msg: 'local server is not running'
    cmds:
      - mkdir -p '{{ .OUTDIR }}'
      - chromium --headless --no-pdf-header-footer --generate-pdf-document-outline --print-to-pdf='{{ joinPath .OUTDIR "Resume - Alex Ramsay.pdf" }}' '{{ .URL }}'

  start:
    desc: Start the Hugo dev server in the background
    if: "! pgrep -f '{{ .HUGO }} server'"
    cmds:
      - "{{ .HUGO }} server -D &"
      - sleep .1 # Workaround to this issue: https://github.com/go-task/task/issues/928

  stop:
    desc: Stop the Hugo dev server
    cmds:
      - pkill -SIGTERM -ef {{ .HUGO }} || true

  tidy:
    desc: Run go mod tidy and update Hugo modules
    cmds:
      - go mod tidy
      - task: update

  update:
    desc: Update Hugo modules to latest versions
    cmds:
      - "{{ .HUGO }} mod get -u"
